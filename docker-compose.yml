services:
  postgres:
    image: postgres:16-alpine
    container_name: food-delivery-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: fooddelivery
      POSTGRES_PASSWORD: fooddelivery
      POSTGRES_DB: fooddelivery
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

volumes:
  postgres_data:
